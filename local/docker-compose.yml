# Offline validation stack. Requires local/data/nairobi.osrm.* (services/osrm/prepare.sh).
name: ride-dispatch

services:
  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in driver-positions:1 ride-assignments:1 sim-control:1 local-lifecycle-events:1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$${t%%:*}" --partitions "$${t##*:}" --replication-factor 1
        done

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    command: osrm-routed --algorithm mld /data/nairobi.osrm
    volumes: ["./data:/data:ro"]
    ports: ["5000:5000"]

  harness:
    image: ride-dispatch/dev:local
    build: { context: .., dockerfile: local/dev.Dockerfile }
    command: python local/harness.py
    volumes: ["..:/w"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_HOST: redis
      OSRM_URL: http://osrm:5000
    ports: ["8765:8765"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_started }
      osrm: { condition: service_started }

  simulator:
    image: ride-dispatch/dev:local
    command: python -m simulator.main
    volumes: ["..:/w"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      OSRM_URL: http://osrm:5000
      EVENT_SINK: kafka
      FLEET_SIZE: "20"
      SPEED_FACTOR: "3"
    depends_on:
      harness: { condition: service_started }
